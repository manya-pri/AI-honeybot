services:
  database:
    build: .
    command: ["python", "-c", "from database import HoneybotDatabase; HoneybotDatabase('/data/honeybot.sqlite')"]
    volumes: ["honeybot_data:/data"]
    networks: [honeynet]
    restart: "no"

  honeypot:
    build: .
    command: ["python", "app.py"]
    environment:
      HONEYPOT_HOST: 0.0.0.0
      HONEYPOT_TRUST_PROXY: "true"
      HONEYPOT_PORT: 5000
      HONEYPOT_DATABASE: /data/honeybot.sqlite
      HONEYPOT_EVENTS_FILE: /data/events.jsonl
      MIN_SUSPICIOUS_EVENTS: 3
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      DEMO_MODE: ${DEMO_MODE:-false}
    volumes: ["honeybot_data:/data"]
    networks: [honeynet]
    depends_on:
      database: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: .
    command: ["python", "-m", "uvicorn", "api_server:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      HONEYPOT_DATABASE: /data/honeybot.sqlite
      HONEYPOT_EVENTS_FILE: /data/events.jsonl
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      DEMO_MODE: ${DEMO_MODE:-false}
    volumes: ["honeybot_data:/data"]
    networks: [honeynet]
    depends_on:
      database: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: .
    command: ["streamlit", "run", "dashboard.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    environment:
      HONEYPOT_EVENTS_FILE: /data/events.jsonl
      HONEYPOT_API_URL: http://backend:8000
      DEMO_MODE: ${DEMO_MODE:-false}
    volumes: ["honeybot_data:/data:ro"]
    networks: [honeynet]
    depends_on: [honeypot, backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  reverse-proxy:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [honeynet]
    depends_on:
      frontend: {condition: service_healthy}
      backend: {condition: service_healthy}
      honeypot: {condition: service_healthy}
    restart: unless-stopped

volumes:
  honeybot_data:

networks:
  honeynet:
    driver: bridge
